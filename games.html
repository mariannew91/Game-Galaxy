<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        
        <title>Game Galaxy 🎮</title>
        <link rel="stylesheet" href="./resources/style.css">
        <script src="./resources/script.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    </head>
    <body id="games-page-body">
        <section class="top-bar-container">
            <div class="top-bar">
                <nav aria-label="Main Navigation">
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="games.html">Games</a></li>
                    </ul>
                </nav>
                <a href="index.html"><img class="logo" src="./resources/images/GGlogo.png" alt="Game Galaxy Logo"></a>
                 <div class="search-bar" role="search">
                    <input type="text" id="search-input" placeholder="Search for games..." aria-label="Search for games">
                    <div class="tooltip">
                        <button id="search-button" aria-label="Search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span class="tooltip-text">Search</span></button>
                    </div>
                    <div class="tooltip">
                        <button id="open-searchbar" aria-label="Open Searchbar"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><span class="tooltip-text">Open Searchbar</span></button>
                    </div>
                </div>
                <div class="search-dropdown"></div>
                <div class="basket">
                    <div class="basket-total"></div>
                    <div class="tooltip">
                        <a href="basket.html" aria-label="Go to basket"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i><span id="basket-count">0</span><span class="tooltip-text">Go to basket</span></a>
                    </div>
                </div>
            </div>
            <div id="discount" role="region" aria-label="Promotion">
                <p>!! Free delivery over £80 !!</p>
            </div>
        </section>
        <header>
            <h1>Choose your games</h1>
        </header>
        <div id="search-results-container">
            <div id="search-results"></div>
        </div>
        <div class="games-main-body">
            <div id="filter-bar">
                <section id="filter" aria-label="Filter Games">
                    <div id="filter-buttons">
                        <button id="genre" aria-expanded="false" aria-controls="genre-container">Genre <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
                        <button id="price" aria-expanded="false" aria-controls="price-container">Price <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
                        <button id="clear-all-filters-btn" aria-label="Clear all filters">Clear All<i class="fa-solid fa-x" aria-hidden="true"></i></button>
                    </div>
                    <div id="chosen-filters"></div>
                    <div id="filter-dropdown-container">
                        <div id="genre-container" class="options-container">
                            <p>Select genre<span class="clear" id="clear-genre"></span></p>
                            <div class="filter-options" id="genre-options">
                                <label><input type="checkbox" name="genre-choice" value="RPG"> RPG</label>
                                <label><input type="checkbox" name="genre-choice" value="Open World"> Open World</label>
                                <label><input type="checkbox" name="genre-choice" value="Platformer"> Platformer</label>
                                <label><input type="checkbox" name="genre-choice" value="Action-Adventure"> Action Adventure</label>
                                <label><input type="checkbox" name="genre-choice" value="Stealth"> Stealth</label>
                            </div>
                        </div>
                        <div id="price-container" class="options-container">
                            <p>Select price<span class="clear" id="clear-price"></span></p>
                            <div class="filter-options" id="price-options">
                                <label><input type="checkbox" name="price-choice" value="10-20"> £10-20</label>
                                <label><input type="checkbox" name="price-choice" value="20-30"> £20-30</label>
                                <label><input type="checkbox" name="price-choice" value="30-40"> £30-40</label>
                                <label><input type="checkbox" name="price-choice" value="40-50"> £40-50</label>
                                <label><input type="checkbox" name="price-choice" value="50-50"> £50-60</label>
                                <label><input type="checkbox" name="price-choice" value="60-70"> £60+</label>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
            <section class="for-sale-games" aria-label="Games list">

            </section>

        </div>
        <div id="slide-up">
            <div id="slide-up-text">
            </div>
        </div>
        <footer>
            <p>This website is a portfolio project built for educational purposes only. It is not an actual commercial store, and no items are for sale.</p>
        </footer>
    </body>
</html>
