<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
        
        <title>Game Galaxy 🎮</title>
        <link rel="stylesheet" href="./resources/style.css">
        <script src="./resources/script.js" defer></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    </head>
    <body>
        <section class="top-bar-container">
            <div class="top-bar">
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="games.html">Games</a></li>
                    </ul>
                </nav>
                <a href="index.html"><img class="logo" src="./resources/images/GGlogo.png" alt="Game Galaxy Logo"></a>
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="Search for games...">
                    <button id="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
                    <button id="open-searchbar"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
                <div class="search-dropdown"></div>
                <div class="basket">
                    <div class="basket-total"></div>
                    <a href="basket.html"><i class="fa-solid fa-cart-shopping"></i><span id="basket-count">0</span></a>
                </div>
            </div>
            <div id="discount">
                <p>!! Free delivery over £80 !!</p>
            </div>
        </section>
        <header id="basket-header">
            <h1>Basket total <span class="basket-total"></span></h1>
        </header>
        <div class="main-body" id="basket-main-body">
            <div id="basket-top" class="visible">
                <section class="basket-items"></section>
                <section id="basket-bottom">
                    <div id="basket-summary"></div>
                    <div id="checkout-btn-container"></div>
                    <div class="empty-basket"></div>
                </section>
            </div>
            <div class="basket-emptied">
                <h2>Basket emptied</h2>
                <button id="undo-empty">Undo <i class="fa-solid fa-arrow-rotate-left"></i></button>
                <p id="countdown"></p>
            </div>
        </div>
        <footer>
            <p>This website is a portfolio project built for educational purposes only. It is not an actual commercial store, and no items are for sale.</p>
        </footer>
    </body>
</html>
